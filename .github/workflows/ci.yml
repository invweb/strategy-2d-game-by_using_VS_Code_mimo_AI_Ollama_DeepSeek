name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build common module
        run: ./gradlew :common:compileKotlinJvm

      - name: Build desktop module
        run: ./gradlew :desktop:compileKotlin

      - name: Run full build
        run: ./gradlew build
