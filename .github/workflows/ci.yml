name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run all unit tests
        run: ./gradlew :common:jvmTest :desktop:test :server:test

      - name: Build desktop
        run: ./gradlew :desktop:installDist

      - name: Build server
        run: ./gradlew :server:installDist

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: desktop/build/install/desktop/

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: server/build/install/server/
