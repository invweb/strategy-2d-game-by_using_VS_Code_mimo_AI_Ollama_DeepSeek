name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build desktop
        run: ./gradlew :desktop:installDist

      - name: Build server
        run: ./gradlew :server:installDist

      - name: Create desktop zip
        run: cd desktop/build/install && zip -r ../../../desktop.zip desktop/

      - name: Create server zip
        run: cd server/build/install && zip -r ../../../server.zip server/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            desktop.zip
            server.zip
          generate_release_notes: true
